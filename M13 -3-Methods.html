<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>
    <script>
    var str = "AmAzInG";
    document.write(str.toUpperCase()); //upper case
    document.write("<br>");
    document.write(str.toLowerCase()); //lower case
    document.write("<br>");
    document.write(str.startsWith('i')); //false
    document.write("<br>");

    // Test Method -> returns true or false
    var str1 = "I learnt about Methods";
    var patt = new RegExp("about"); //check a string pattern matching
    var res = patt.test(str1); 
    document.write(res); //true

    </script>
  </body>
</html>
