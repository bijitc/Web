<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>
    <script>
    var str = "AmAzInG";
    document.write(str.toUpperCase()); //ouput 1
    document.write("<br>");
    document.write(str.toLowerCase()); //ouput 2
    document.write("<br>");
    document.write(str.startsWith('i')); //output 3
    document.write("<br>");

    // Test Method -> returns true or false
    var str1 = "I learnt about Methods";
    var patt = new RegExp("about"); //check a string pattern matching
    var res = patt.test(str1);
    document.write(res); //output 4

    </script>
  </body>
</html>
