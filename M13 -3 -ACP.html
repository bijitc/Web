<html>   
<body>
    <p id="day"></p>
    <script>
        // Print the day using List
        var number = new Date().getDay();
        var days = ["Sunday", "Monday", "Tuesday", "Wednesday","Thursday", "Friday","Saturday"];
        document.getElementById("day").innerHTML = "Today is: " + days[number]; //use number as index
    </script>
    
</html>
