<!DOCTYPE html>
<html>
    <body>
        <h2>Available fruits:</h2>
        <script>    
            //List
            var fruits = ["Apple", "Mango", "Grapes","Watermelon", "Jack Fruit", "Banana"];             

            //Counter: number of repetitions
            var i;   
            //Loop : initialize counter, check, increment
            for (i = 0; i < fruits.length; i++) { // fruits index: 0 to 5
                document.write(fruits[i] + "<br>"); // text = "Apple <br> Mango <br> ..."
            }
        </script>
    </body>
</html>
