<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Object Example</title>
</head>
<body>
  <script>
    // Class function
    class User{
        company;
        constructor(name,role){
            this.name = name;
            this.role = role;
        }
        getCompany(){
          return this.company;
        }
        setCompany(comp){
          this.company = comp;
        }
        greet(company_name){
          return "Hello, I'm " + this.name + " and I work as a " + this.role + " for " + company_name + ".";
      }
    }

    // Object
    var user = new User("Riya", "Developer");
    user.setCompany("Google");
    company_name = user.getCompany(this.company);
    document.write(user.greet(company_name));
  </script>

</body>
</html>
