<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Variables</h1>
<p>Sum of two Numbers</p>
<p id="result"></p>

<script>
    // Variables
    var num1 = 5; // Statement 1
    var num2 = 6; // Statement 2
    // Operators: here operator "+" is used to add two numbers
    var sum = num1 + num2; // Statement 3 

    //script updates the content of the paragraph
    document.getElementById("result").innerHTML = "The total sum is: " + sum;

</script>

</body>

</html>
