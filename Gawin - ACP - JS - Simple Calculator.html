<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro to JavaScript</title>
  </head>
  <body>
    <h1>JavaScript Variables</h1>

    <p id="result"></p>
    <p id="result2"></p>
    <p id="result3"></p>
    <p id="result4"></p>

    <script>
      var num1 = 5;
      var num2 = 6;
      var prod = num1*num2;
      var diff = num1 - num2;
      var div = num1/num2;
      var sum = num1 + num2;
      document.getElementById("result").innerHTML = "The total sum is: " + sum;
      document.getElementById("result2").innerHTML = "The product is: " + prod;
      document.getElementById("result3").innerHTML = "The difference is: " + diff;
      document.getElementById("result4").innerHTML = "The quotient is: " + div;
    </script>
  </body>
</html>
